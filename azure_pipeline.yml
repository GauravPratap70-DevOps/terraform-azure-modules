trigger:
  branches:
    include:
      - main
      - feature-branch

pool:
  name: 'My pipeline Agent'

steps:

- checkout: self

# Download the latest secure terraform.tfvars
- task: DownloadSecureFile@1
  name: tfvars
  displayName: 'Download Terraform Variables'
  inputs:
    secureFile: 'terraform.tfvars'

# Copy secure tfvars into Terraform working directory
- powershell: |
    Copy-Item "$(tfvars.secureFilePath)" "$(Build.SourcesDirectory)\my_parent_module\terraform.tfvars" -Force
  displayName: 'Copy Terraform Variables'

- script: terraform --version
  displayName: 'Terraform Version'

- script: terraform init
  displayName: 'Terraform Init'
  workingDirectory: '$(Build.SourcesDirectory)\my_parent_module'

- script: terraform fmt -check
  displayName: 'Terraform Format Check'
  workingDirectory: '$(Build.SourcesDirectory)\my_parent_module'

- script: terraform validate
  displayName: 'Terraform Validate'
  workingDirectory: '$(Build.SourcesDirectory)\my_parent_module'

- script: terraform plan -var-file="terraform.tfvars"
  displayName: 'Terraform Plan'
  workingDirectory: '$(Build.SourcesDirectory)\my_parent_module'